# Prep for trainee, summer trainee, forestry and research assistant jobs. CVs: trainee-master, forestry-master.
# Every draft answer uses only the facts in CV-RULES.md (cv repo). An empty answer has a hint:
# the facts don't cover it, so David writes it once on the Prep page and it is reused.
label: "Trainee"
intro_fi: "Olen 24-vuotias ja opiskelen kestävää metsäbiotaloutta Itä-Suomen yliopistossa Joensuussa."
intro_en: "I'm 24 and I study Sustainable Forest Bioeconomy at the University of Eastern Finland in Joensuu."
questions:
  - id: "about"
    q_fi: "Kerro itsestäsi."
    q_en: "Tell me about yourself."
    a_fi: "Olen David, 24-vuotias kestävän metsäbiotalouden opiskelija Itä-Suomen yliopistossa. Olin elo–lokakuussa 2025 asentajana UPM Kaukaan sellutehtaalla, ja työnantaja arvioi työni kiitettäväksi. Taustani on tietotekniikassa. Suomen kielen taitoni on vielä perustasolla, ja opiskelen sitä aktiivisesti."
    a_en: "I'm David, 24, a Sustainable Forest Bioeconomy student at the University of Eastern Finland. From August to October 2025 I was a fitter at the UPM Kaukas pulp mill, and my employer rated my work excellent. My background is in IT. My Finnish is still basic, and I'm actively studying it."
  - id: "studies"
    q_fi: "Kerro opinnoistasi."
    q_en: "Tell me about your studies."
    a_fi: "Aloitin kestävän metsäbiotalouden kandidaattiopinnot Itä-Suomen yliopistossa vuonna 2026. Sitä ennen opiskelin tietotekniikkaa VAMKissa, ja minulla on OND-tutkinto tietojenkäsittelystä Nigeriasta."
    a_en: "I started a B.Sc in Sustainable Forest Bioeconomy at the University of Eastern Finland in 2026. Before that I studied IT at VAMK, and I have an OND in Computer Science from Nigeria."
  - id: "mill"
    q_fi: "Mitä teit metsäteollisuudessa?"
    q_en: "What did you do in the forest industry?"
    a_fi: "Olin asentajana Axioma Servisas UAB:llä sähkösuodattimen uudelleenrakennushankkeessa UPM Kaukaan sellutehtaalla Lappeenrannassa. Käytin kulmahiomakonetta ja nostolaitteita ja noudatin tehtaan tiukkoja turvallisuussääntöjä."
    a_en: "I was a fitter with Axioma Servisas UAB on an electrostatic precipitator rebuild project at the UPM Kaukas pulp mill in Lappeenranta. I used angle grinders and lifting equipment and worked to the mill's strict safety rules."
  - id: "research"
    q_fi: "Onko sinulla kokemusta haastatteluista tai tiedonkeruusta?"
    q_en: "Have you done interviews or collected data?"
    a_fi: "Vaasa Startup Factoryssa selvitin käyttäjien tarpeita haastatteluilla ja puheluilla. Sen jälkeen rakensimme ja esittelimme tiimin kanssa hetkin.appin."
    a_en: "At Vaasa Startup Factory I researched user needs with interviews and calls. Then we built and pitched hetkin.app as a team."
  - id: "software"
    q_fi: "Mitä ohjelmia osaat käyttää?"
    q_en: "Which software can you use?"
    a_fi: "Microsoft Officea. Microsoft Active Directoryn opin VAMKin IT-opinnoissa. Omissa projekteissani käytän tekoälyagentteja (Claude Code) ja GitHubia."
    a_en: "Microsoft Office. I learned Microsoft Active Directory in my IT studies at VAMK. In my own projects I use AI coding agents (Claude Code) and GitHub."
  - id: "projects"
    q_fi: "Mitä teet omissa projekteissasi?"
    q_en: "What do you do in your own projects?"
    a_fi: "Rakennan käytännön työkaluja tekoälyagenttien avulla (Claude Code). Kirjoitan määrittelyn ja säännöt, joita agentti noudattaa, ohjaan sitä ja tarkistan tuloksen. Teen myös metsäaiheista oppimispeliä 8–16-vuotiaille."
    a_en: "I build practical tools with AI coding agents (Claude Code). I write the spec and the rules the agent follows, guide it and check the result. I'm also making a forest learning game for children aged 8–16."
  - id: "team"
    q_fi: "Millainen olet tiimissä?"
    q_en: "How do you work in a team?"
    a_fi: "Vaasa Startup Factoryssa rakensimme ja esittelimme tiimin kanssa hetkin.appin. Lehdenjakajana tein töitä yksin, joten kumpikin tapa on minulle tuttu."
    a_en: "At Vaasa Startup Factory we built and pitched hetkin.app as a team. As a newspaper courier I worked alone, so I know both ways of working."
  - id: "employer"
    q_fi: "Mitä edellinen työnantajasi sanoisi sinusta?"
    q_en: "What would your last employer say about you?"
    a_fi: "Työtodistuksessani lukee: vastuuntuntoinen ja tunnollinen työntekijä, halukas oppimaan ja ottamaan vastuuta. Arvosana oli kiitettävä."
    a_en: "My work certificate says: a responsible and conscientious employee, eager to learn and to take responsibility. The rating was excellent."
  - id: "finnish"
    q_fi: "Miten pärjäät suomen kielellä?"
    q_en: "How is your Finnish?"
    a_fi: "Suomen kielen taitoni on vielä perustasolla, ja opiskelen sitä aktiivisesti. Puhun englantia sujuvasti."
    a_en: "My Finnish is still basic, and I'm actively studying it. I speak English fluently."
  - id: "period"
    q_fi: "Milloin voit aloittaa, ja kuinka pitkäksi aikaa?"
    q_en: "When can you start, and for how long?"
    a_fi: ""
    a_en: ""
    hint: "Your facts don't say when you can start or for how long. Write it once; it's reused for every Trainee job."
ask:
  - fi: "Mitä harjoittelija tekee ensimmäisinä viikkoina?"
    en: "What does a trainee do in the first weeks?"
  - fi: "Kuka ohjaa harjoittelijaa?"
    en: "Who supervises the trainee?"
  - fi: "Voiko osan töistä tehdä englanniksi?"
    en: "Can some of the work be done in English?"
  - fi: "Onko harjoittelun jälkeen mahdollista jatkaa?"
    en: "Is it possible to continue after the traineeship?"
