# Prep for warehouse and logistics jobs. CV: warehouse-master.
# Every draft answer uses only the facts in CV-RULES.md (cv repo). An empty answer has a hint:
# the facts don't cover it, so David writes it once on the Prep page and it is reused.
label: "Warehouse"
intro_fi: "Olen 24-vuotias ja asun Joensuussa. Olen ollut asentajana UPM Kaukaan sellutehtaalla ja lehdenjakajana Vaasassa."
intro_en: "I'm 24 and I live in Joensuu. I've worked as a fitter at the UPM Kaukas pulp mill and as a newspaper courier in Vaasa."
questions:
  - id: "about"
    q_fi: "Kerro itsestäsi."
    q_en: "Tell me about yourself."
    a_fi: "Olen David, 24-vuotias, ja asun Joensuussa. Olin elo–lokakuussa 2025 asentajana UPM Kaukaan sellutehtaalla, ja siellä seurasin työkaluja ja materiaaleja. Ennen sitä jaoin lehtiä Vaasassa aikaisin aamulla. Suomen kielen taitoni on vielä perustasolla, ja opiskelen sitä aktiivisesti."
    a_en: "I'm David, 24, and I live in Joensuu. From August to October 2025 I was a fitter at the UPM Kaukas pulp mill, where I kept track of tools and materials. Before that I delivered newspapers in Vaasa early in the morning. My Finnish is still basic, and I'm actively studying it."
  - id: "warehouse"
    q_fi: "Onko sinulla varastokokemusta?"
    q_en: "Do you have warehouse experience?"
    a_fi: "Varastossa en ole vielä ollut töissä. Sellutehtaan työmaalla seurasin työkaluja ja materiaaleja ja pidin työmaan siistinä. Haluan oppia varastotyön."
    a_en: "I haven't worked in a warehouse yet. On the pulp mill site I kept track of tools and materials and kept the site clean. I want to learn warehouse work."
  - id: "early"
    q_fi: "Sopiiko sinulle aikainen aloitus?"
    q_en: "Are early starts OK for you?"
    a_fi: "Lehdenjakajana Vaasassa aloitin työt aikaisin aamulla ja kuljin reitit yksin, huhtikuusta elokuuhun 2025."
    a_en: "As a newspaper courier in Vaasa I started early in the morning and did the routes alone, from April to August 2025."
  - id: "machines"
    q_fi: "Mitä koneita olet käyttänyt?"
    q_en: "Which machines have you used?"
    a_fi: "Olen käyttänyt kulmahiomakonetta ja nostolaitteita sellutehtaan työmaalla."
    a_en: "I've used angle grinders and lifting equipment on the pulp mill site."
  - id: "safety"
    q_fi: "Miten huolehdit työturvallisuudesta?"
    q_en: "How do you keep work safe?"
    a_fi: "Minulla on työturvallisuuskortti. Sellutehtaalla oli tiukat turvallisuussäännöt, ja noudatin niitä."
    a_en: "I have the occupational safety card. The pulp mill had strict safety rules, and I followed them."
  - id: "computer"
    q_fi: "Osaatko käyttää tietokonetta?"
    q_en: "Can you use a computer?"
    a_fi: "Kyllä, minulla on tietokoneen perustaidot. Opiskelin tietotekniikkaa VAMKissa."
    a_en: "Yes, I have basic computer skills. I studied IT at VAMK."
  - id: "employer"
    q_fi: "Mitä edellinen työnantajasi sanoisi sinusta?"
    q_en: "What would your last employer say about you?"
    a_fi: "Työtodistuksessani lukee: vastuuntuntoinen ja tunnollinen työntekijä, halukas oppimaan ja ottamaan vastuuta. Arvosana oli kiitettävä."
    a_en: "My work certificate says: a responsible and conscientious employee, eager to learn and to take responsibility. The rating was excellent."
  - id: "team"
    q_fi: "Työskenteletkö mieluummin yksin vai porukassa?"
    q_en: "Do you prefer working alone or in a team?"
    a_fi: "Kumpikin sopii. Lehdenjakajana kuljin reitit yksin. Vaasa Startup Factoryssa tein töitä tiimissä."
    a_en: "Both suit me. As a courier I did the routes alone. At Vaasa Startup Factory I worked in a team."
  - id: "finnish"
    q_fi: "Miten pärjäät suomen kielellä?"
    q_en: "How is your Finnish?"
    a_fi: "Suomen kielen taitoni on vielä perustasolla, ja opiskelen sitä aktiivisesti. Puhun englantia sujuvasti."
    a_en: "My Finnish is still basic, and I'm actively studying it. I speak English fluently."
  - id: "start"
    q_fi: "Milloin voit aloittaa?"
    q_en: "When can you start?"
    a_fi: ""
    a_en: ""
    hint: "Your facts don't say when you can start. Write it once; it's reused for every Warehouse job."
ask:
  - fi: "Millainen on tavallinen työvuoro?"
    en: "What does a normal shift look like?"
  - fi: "Mitä järjestelmiä varastossa käytetään?"
    en: "Which systems do you use in the warehouse?"
  - fi: "Voiko trukkikortin suorittaa työn kautta?"
    en: "Can I get the forklift card through the job?"
  - fi: "Kuka perehdyttää uudet työntekijät?"
    en: "Who trains new workers?"
