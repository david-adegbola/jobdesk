# Honest one-line answers for each blocker JobDesk can find in an ad (labels from match.py BLOCKERS).
# Each says David doesn't have it yet and wants to learn. A job type's file can override one
# under its own "blockers:" list; edits saved on the Prep page are kept per job type.
blockers:
  - label: "welding"
    fi: "Minulla ei ole vielä hitsauskokemusta, mutta haluan oppia hitsaamaan."
    en: "I don't have welding experience yet, but I want to learn to weld."
  - label: "welding certificate"
    fi: "Minulla ei ole vielä hitsauspätevyyttä, mutta haluan suorittaa sen."
    en: "I don't have a welding certificate yet, but I want to get one."
  - label: "hot-work card"
    fi: "Minulla ei ole vielä tulityökorttia, mutta suoritan sen mielelläni."
    en: "I don't have the hot-work card yet, but I'm happy to take the course."
  - label: "forklift card"
    fi: "Minulla ei ole vielä trukkikorttia, mutta suoritan sen mielelläni."
    en: "I don't have the forklift card yet, but I'm happy to take the course."
  - label: "reading drawings"
    fi: "En osaa vielä lukea piirustuksia, mutta opettelen lukemaan asennuspiirustuksia."
    en: "I can't read drawings yet, but I'm learning to read assembly drawings."
  - label: "B licence"
    fi: "Minulla ei ole vielä B-ajokorttia, mutta haluan suorittaa sen."
    en: "I don't have a B driving licence yet, but I want to get one."
  - label: "C licence"
    fi: "Minulla ei ole vielä C-ajokorttia, mutta haluan suorittaa sen."
    en: "I don't have a C driving licence yet, but I want to get one."
  - label: "fluent Finnish"
    fi: "Suomen kielen taitoni on vielä perustasolla, ja opiskelen sitä aktiivisesti. Puhun englantia sujuvasti."
    en: "My Finnish is still basic, and I'm actively studying it. I speak English fluently."
  - label: "electrician qualification"
    fi: "Minulla ei ole sähköalan pätevyyttä, mutta haluan oppia sähkötöitä."
    en: "I don't have an electrician qualification yet, but I want to learn electrical work."
  - label: "electrical safety card"
    fi: "Minulla ei ole vielä sähkötyöturvallisuuskorttia, mutta suoritan sen mielelläni."
    en: "I don't have the electrical safety card yet, but I'm happy to take the course."
  - label: "first aid card"
    fi: "Minulla ei ole vielä ensiapukorttia, mutta suoritan sen mielelläni."
    en: "I don't have a first aid card yet, but I'm happy to take the course."
  - label: "1+ years' experience"
    fi: "Minulla ei ole vielä niin paljon kokemusta tältä alalta, mutta haluan oppia työn."
    en: "I don't have that much experience in this field yet, but I want to learn the work."
  - label: "vocational qualification"
    fi: "Minulla ei ole alan ammatillista tutkintoa. Olen opiskellut tietotekniikkaa VAMKissa, ja haluan oppia tämän työn käytännössä."
    en: "I don't have a vocational qualification in this field. I studied IT at VAMK, and I want to learn this work on the job."
  - label: "brush saw experience"
    fi: "En ole vielä käyttänyt raivaussahaa, mutta haluan oppia sen."
    en: "I haven't used a brush saw yet, but I want to learn."
  - label: "chainsaw"
    fi: "En ole vielä käyttänyt moottorisahaa, mutta haluan oppia sen."
    en: "I haven't used a chainsaw yet, but I want to learn."
  - label: "forest machine operator qualification"
    fi: "Minulla ei ole metsäkoneenkuljettajan tutkintoa, mutta haluan oppia metsäkoneiden käyttöä."
    en: "I don't have a forest machine operator qualification, but I want to learn to use forest machines."
  - label: "forestry degree"
    fi: "Opiskelen kestävää metsäbiotaloutta Itä-Suomen yliopistossa, ja tutkintoni on vielä kesken."
    en: "I'm studying Sustainable Forest Bioeconomy at the University of Eastern Finland, and my degree isn't finished yet."
