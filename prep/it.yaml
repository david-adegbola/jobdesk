# Prep for IT field technician, support and data centre jobs. CV: it-field-technician.
# Every draft answer uses only the facts in CV-RULES.md (cv repo), including the hands-on IT list.
label: "IT"
intro_fi: "Olen 24-vuotias ja asun Joensuussa. Opiskelin tietotekniikkaa VAMKissa, ja olen tehnyt käytännön IT-asennustöitä."
intro_en: "I'm 24 and I live in Joensuu. I studied IT at VAMK, and I've done hands-on IT installation work."
questions:
  - id: "about"
    q_fi: "Kerro itsestäsi."
    q_en: "Tell me about yourself."
    a_fi: "Olen David, 24-vuotias, ja asun Joensuussa. Opiskelin tietotekniikkaa VAMKissa vuosina 2024–2026, ja minulla on OND-tutkinto tietojenkäsittelystä Nigeriasta. Olen asentanut palvelimia, verkkokaapeleita ja työasemia. Suomen kielen taitoni on vielä perustasolla, ja opiskelen sitä aktiivisesti."
    a_en: "I'm David, 24, and I live in Joensuu. I studied IT at VAMK from 2024 to 2026, and I have an OND in Computer Science from Nigeria. I've installed servers, network cables and workstations. My Finnish is still basic, and I'm actively studying it."
  - id: "hardware"
    q_fi: "Millaista laitteistotyötä olet tehnyt?"
    q_en: "What hardware work have you done?"
    a_fi: "Olen asentanut palvelimia räkkiin ja vaihtanut levyjä, muistia ja virtalähteitä. Olen myös hoitanut kaapeloinnin ja merkinnät."
    a_en: "I've rack-mounted servers and replaced drives, memory and power supplies. I've also done cable management and labelling."
  - id: "network"
    q_fi: "Mitä verkkotöitä olet tehnyt?"
    q_en: "What network work have you done?"
    a_fi: "Olen kytkenyt ja jäljittänyt verkkokaapeleita, kytkenyt kytkimiä ja tukiasemia ja tarkistanut yhteydet."
    a_en: "I've patched and traced network cables, connected switches and access points, and checked connectivity."
  - id: "pos"
    q_fi: "Oletko asentanut kassalaitteita?"
    q_en: "Have you installed point-of-sale devices?"
    a_fi: "Olen vaihtanut maksupäätteitä, kuittitulostimia ja viivakoodinlukijoita laitevalmistajan ohjeiden mukaan."
    a_en: "I've replaced payment terminals, receipt printers and scanners by following the vendor's steps."
  - id: "workstation"
    q_fi: "Miten asennat uuden työaseman?"
    q_en: "How do you set up a new workstation?"
    a_fi: "Olen asentanut kannettavia, pöytäkoneita, tulostimia ja oheislaitteita ja tehnyt Windowsin perusvianetsintää. Olen myös liittänyt koneita toimialueeseen."
    a_en: "I've set up laptops, desktops, printers and peripherals and done basic Windows troubleshooting. I've also joined computers to a domain."
  - id: "ad"
    q_fi: "Mitä olet tehnyt Active Directoryssa?"
    q_en: "What have you done in Active Directory?"
    a_fi: "Olen hallinnut käyttäjätilejä ja ryhmiä, vaihtanut salasanoja ja liittänyt koneita toimialueeseen. Opin Active Directoryn VAMKin opinnoissa."
    a_en: "I've managed user accounts and groups, reset passwords and joined computers to a domain. I learned Active Directory in my VAMK studies."
  - id: "notes"
    q_fi: "Miten dokumentoit työsi?"
    q_en: "How do you document your work?"
    a_fi: "Teen työt työtilauksen mukaan ja pidän työstä muistiinpanot ja kuvat."
    a_en: "I follow the work order and keep job notes and photos."
  - id: "customers"
    q_fi: "Millaista asiakaspalvelukokemusta sinulla on?"
    q_en: "What customer service experience do you have?"
    a_fi: "Olin myyjänä Desire Feedsillä Lagosissa, ja siellä palvelin ja neuvoin asiakkaita."
    a_en: "I was a salesperson at Desire Feeds in Lagos, where I served and advised customers."
  - id: "projects"
    q_fi: "Mitä teet omissa projekteissasi?"
    q_en: "What do you do in your own projects?"
    a_fi: "Rakennan käytännön työkaluja tekoälyagenttien avulla (Claude Code). Kirjoitan määrittelyn ja säännöt, joita agentti noudattaa, ohjaan sitä ja tarkistan tuloksen. Esimerkiksi CV:ni rakentuvat PDF:ksi automaattisesti GitHub Actionsilla."
    a_en: "I build practical tools with AI coding agents (Claude Code). I write the spec and the rules the agent follows, guide it and check the result. For example, my CVs are built to PDF automatically with GitHub Actions."
  - id: "finnish"
    q_fi: "Miten pärjäät suomen kielellä?"
    q_en: "How is your Finnish?"
    a_fi: "Suomen kielen taitoni on vielä perustasolla, ja opiskelen sitä aktiivisesti. Puhun englantia sujuvasti."
    a_en: "My Finnish is still basic, and I'm actively studying it. I speak English fluently."
blockers:
  - label: "1+ years' experience"
    fi: "Minulla ei ole vielä vuoden työkokemusta IT-alalta. Olen tehnyt käytännön asennustöitä ja opiskellut tietotekniikkaa VAMKissa."
    en: "I don't have a year of IT work experience yet. I've done hands-on installation work and studied IT at VAMK."
ask:
  - fi: "Millaisia työtilauksia teknikko tekee tavallisesti?"
    en: "What kind of work orders does a technician usually do?"
  - fi: "Kuinka paljon työssä matkustetaan?"
    en: "How much travel is there in the job?"
  - fi: "Mitä laitteita ja järjestelmiä käytätte?"
    en: "Which devices and systems do you use?"
  - fi: "Voiko työn kautta suorittaa sertifikaatteja?"
    en: "Can I get certifications through the job?"
