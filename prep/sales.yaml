# Prep for sales and customer service jobs. CV: salesperson.
# Every draft answer uses only the facts in CV-RULES.md (cv repo). An empty answer has a hint:
# the facts don't cover it, so David writes it once on the Prep page and it is reused.
label: "Sales"
intro_fi: "Olen 24-vuotias ja asun Joensuussa. Olen tehnyt myyntiä ja asiakaspalvelua Nigeriassa."
intro_en: "I'm 24 and I live in Joensuu. I've done sales and customer service work in Nigeria."
questions:
  - id: "about"
    q_fi: "Kerro itsestäsi."
    q_en: "Tell me about yourself."
    a_fi: "Olen David, 24-vuotias, ja asun Joensuussa. Myin eläinrehua Desire Feedsillä Lagosissa vuosina 2019–2020, ja sitä ennen olin myyjänä ja keittiöapulaisena Bunmi Pastriesissa Ibadanissa. Suomessa olin asentajana UPM Kaukaan sellutehtaalla. Suomen kielen taitoni on vielä perustasolla, ja opiskelen sitä aktiivisesti."
    a_en: "I'm David, 24, and I live in Joensuu. I sold animal feed at Desire Feeds in Lagos in 2019–2020, and before that I was a sales assistant and kitchen helper at Bunmi Pastries in Ibadan. In Finland I worked as a fitter at the UPM Kaukas pulp mill. My Finnish is still basic, and I'm actively studying it."
  - id: "sales"
    q_fi: "Millaista myyntikokemusta sinulla on?"
    q_en: "What sales experience do you have?"
    a_fi: "Desire Feedsillä myin rehua, neuvoin asiakkaita ja täsmäytin kassan päivän päätteeksi. Olin siellä maaliskuusta 2019 syyskuuhun 2020."
    a_en: "At Desire Feeds I sold feed, advised customers and balanced the cash at the end of the day. I worked there from March 2019 to September 2020."
  - id: "cash"
    q_fi: "Oletko käsitellyt rahaa tai kassaa?"
    q_en: "Have you handled cash or a till?"
    a_fi: "Kyllä. Desire Feedsillä täsmäytin kassan päivän päätteeksi."
    a_en: "Yes. At Desire Feeds I balanced the cash at the end of the day."
  - id: "service"
    q_fi: "Kerro asiakaspalvelukokemuksestasi."
    q_en: "Tell me about your customer service experience."
    a_fi: "Bunmi Pastriesissa Ibadanissa olin myyjänä ja keittiöapulaisena vuosina 2016–2018. Desire Feedsillä palvelin ja neuvoin asiakkaita."
    a_en: "At Bunmi Pastries in Ibadan I was a sales assistant and kitchen helper from 2016 to 2018. At Desire Feeds I served and advised customers."
  - id: "needs"
    q_fi: "Miten selvität, mitä asiakas tarvitsee?"
    q_en: "How do you find out what a customer needs?"
    a_fi: "Desire Feedsillä neuvoin asiakkaita. Vaasa Startup Factoryssa selvitin käyttäjien tarpeita haastatteluilla ja puheluilla."
    a_en: "At Desire Feeds I advised customers. At Vaasa Startup Factory I researched user needs with interviews and calls."
  - id: "pitch"
    q_fi: "Oletko esitellyt tuotetta?"
    q_en: "Have you presented a product?"
    a_fi: "Kyllä. Vaasa Startup Factoryssa rakensimme tiimin kanssa hetkin.appin ja esittelimme sen."
    a_en: "Yes. At Vaasa Startup Factory we built hetkin.app as a team and pitched it."
  - id: "volunteer"
    q_fi: "Mitä teet vapaa-ajallasi?"
    q_en: "What do you do in your free time?"
    a_fi: "Olin vapaaehtoisena Vaasa City Churchissa ja hoidin äänen ja videon joka viikonloppu marraskuusta 2024 elokuuhun 2026."
    a_en: "I volunteered at Vaasa City Church and ran sound and video every weekend from November 2024 to August 2026."
  - id: "employer"
    q_fi: "Mitä edellinen työnantajasi sanoisi sinusta?"
    q_en: "What would your last employer say about you?"
    a_fi: "Työtodistuksessani lukee: vastuuntuntoinen ja tunnollinen työntekijä, halukas oppimaan ja ottamaan vastuuta. Arvosana oli kiitettävä."
    a_en: "My work certificate says: a responsible and conscientious employee, eager to learn and to take responsibility. The rating was excellent."
  - id: "finnish"
    q_fi: "Miten pärjäät suomen kielellä?"
    q_en: "How is your Finnish?"
    a_fi: "Suomen kielen taitoni on vielä perustasolla, ja opiskelen sitä aktiivisesti. Puhun englantia sujuvasti, ja äidinkieleni on joruba."
    a_en: "My Finnish is still basic, and I'm actively studying it. I speak English fluently, and my native language is Yoruba."
  - id: "start"
    q_fi: "Milloin voit aloittaa?"
    q_en: "When can you start?"
    a_fi: ""
    a_en: ""
    hint: "Your facts don't say when you can start. Write it once; it's reused for every Sales job."
blockers:
  - label: "1+ years' experience"
    fi: "Myin rehua Desire Feedsillä Lagosissa puolitoista vuotta, maaliskuusta 2019 syyskuuhun 2020."
    en: "I sold feed at Desire Feeds in Lagos for a year and a half, from March 2019 to September 2020."
ask:
  - fi: "Millaisia tuotteita myisin?"
    en: "What products would I sell?"
  - fi: "Miten uusi myyjä perehdytetään?"
    en: "How do you train a new salesperson?"
  - fi: "Miten myyntiä seurataan?"
    en: "How do you follow up on sales?"
  - fi: "Millaiset työvuorot ovat?"
    en: "What are the shifts like?"
