# Prep for industrial jobs (fitter, assembler, production, construction).
# Generic template: answers are empty, so each one is written once on the Prep page and reused for
# every Industrial job. Copy this folder to owner/prep/ to keep drafts in files (git-ignored).
label: "Industrial"
intro_fi: ""
intro_en: ""
questions:
  - id: "about"
    q_fi: "Kerro itsestäsi."
    q_en: "Tell me about yourself."
    a_fi: ""
    a_en: ""
    hint: "Two or three sentences: who you are, your most relevant work, your Finnish level."
  - id: "mill"
    q_fi: "Kerro aiemmasta työkokemuksestasi."
    q_en: "Tell me about your previous work experience."
    a_fi: ""
    a_en: ""
    hint: "Your most relevant job: where, what you did, which tools you used."
  - id: "tools"
    q_fi: "Mitä työkaluja ja koneita osaat käyttää?"
    q_en: "Which tools and machines can you use?"
    a_fi: ""
    a_en: ""
    hint: "Only tools you have actually used."
  - id: "safety"
    q_fi: "Miten huolehdit työturvallisuudesta?"
    q_en: "How do you keep work safe?"
    a_fi: ""
    a_en: ""
    hint: "Cards you hold and safety rules you have followed at work."
  - id: "employer"
    q_fi: "Mitä edellinen työnantajasi sanoisi sinusta?"
    q_en: "What would your last employer say about you?"
    a_fi: ""
    a_en: ""
    hint: "Quote your work certificate if you have one."
  - id: "team"
    q_fi: "Työskenteletkö mieluummin yksin vai porukassa?"
    q_en: "Do you prefer working alone or in a team?"
    a_fi: ""
    a_en: ""
  - id: "why"
    q_fi: "Miksi haet tätä työtä?"
    q_en: "Why are you applying for this job?"
    a_fi: ""
    a_en: ""
  - id: "finnish"
    q_fi: "Miten pärjäät suomen kielellä?"
    q_en: "How is your Finnish?"
    a_fi: ""
    a_en: ""
  - id: "start"
    q_fi: "Milloin voit aloittaa?"
    q_en: "When can you start?"
    a_fi: ""
    a_en: ""
    hint: "Write it once; it's reused for every Industrial job."
ask:
  - fi: "Millainen on tavallinen työpäivä?"
    en: "What does a normal working day look like?"
  - fi: "Missä työmaat ovat, ja miten sinne kuljetaan?"
    en: "Where are the work sites, and how do people get there?"
  - fi: "Kenen kanssa työskentelisin?"
    en: "Who would I work with?"
  - fi: "Voiko työn ohessa suorittaa kortteja?"
    en: "Can I get cards while working?"
