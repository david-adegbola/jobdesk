# Prep for industrial jobs (fitter, assembler, production, construction). CV: industrial-master.
# Every draft answer uses only the facts in CV-RULES.md (cv repo). An empty answer has a hint:
# the facts don't cover it, so David writes it once on the Prep page and it is reused.
label: "Industrial"
intro_fi: "Olen 24-vuotias ja asun Joensuussa. Olin elo–lokakuussa 2025 asentajana UPM Kaukaan sellutehtaalla."
intro_en: "I'm 24 and I live in Joensuu. From August to October 2025 I worked as a fitter at the UPM Kaukas pulp mill."
questions:
  - id: "about"
    q_fi: "Kerro itsestäsi."
    q_en: "Tell me about yourself."
    a_fi: "Olen David, 24-vuotias, ja asun Joensuussa. Olin elo–lokakuussa 2025 asentajana sähkösuodattimen uudelleenrakennushankkeessa UPM Kaukaan sellutehtaalla. Työnantaja arvioi työni kiitettäväksi. Suomen kielen taitoni on vielä perustasolla, ja opiskelen sitä aktiivisesti."
    a_en: "I'm David, 24, and I live in Joensuu. From August to October 2025 I was a fitter on an electrostatic precipitator rebuild project at the UPM Kaukas pulp mill. My employer rated my work excellent. My Finnish is still basic, and I'm actively studying it."
  - id: "mill"
    q_fi: "Mitä teit sellutehtaalla?"
    q_en: "What did you do at the pulp mill?"
    a_fi: "Olin asentajana Axioma Servisas UAB:llä sähkösuodattimen uudelleenrakennushankkeessa UPM Kaukaan sellutehtaalla Lappeenrannassa. Käytin kulmahiomakonetta ja nostolaitteita. Pidin työmaan siistinä ja seurasin työkaluja ja materiaaleja."
    a_en: "I was a fitter with Axioma Servisas UAB on an electrostatic precipitator rebuild project at the UPM Kaukas pulp mill in Lappeenranta. I used angle grinders and lifting equipment. I kept the work site clean and kept track of tools and materials."
  - id: "tools"
    q_fi: "Mitä työkaluja ja koneita osaat käyttää?"
    q_en: "Which tools and machines can you use?"
    a_fi: "Olen käyttänyt työmaalla kulmahiomakonetta ja nostolaitteita. Muut koneet opettelen mielelläni perehdytyksessä."
    a_en: "I've used angle grinders and lifting equipment on site. I'm glad to learn other machines during training."
  - id: "safety"
    q_fi: "Miten huolehdit työturvallisuudesta?"
    q_en: "How do you keep work safe?"
    a_fi: "Minulla on työturvallisuuskortti. Sellutehtaalla oli tiukat turvallisuussäännöt, ja noudatin niitä. Pidin myös työmaan siistinä."
    a_en: "I have the occupational safety card. The pulp mill had strict safety rules, and I followed them. I also kept the work site clean."
  - id: "employer"
    q_fi: "Mitä edellinen työnantajasi sanoisi sinusta?"
    q_en: "What would your last employer say about you?"
    a_fi: "Työtodistuksessani lukee: vastuuntuntoinen ja tunnollinen työntekijä, halukas oppimaan ja ottamaan vastuuta. Arvosana oli kiitettävä."
    a_en: "My work certificate says: a responsible and conscientious employee, eager to learn and to take responsibility. The rating was excellent."
  - id: "team"
    q_fi: "Työskenteletkö mieluummin yksin vai porukassa?"
    q_en: "Do you prefer working alone or in a team?"
    a_fi: "Kumpikin sopii. Lehdenjakajana Vaasassa kuljin aamureitit yksin. Vaasa Startup Factoryssa tein töitä tiimissä."
    a_en: "Both suit me. As a newspaper courier in Vaasa I did the morning routes alone. At Vaasa Startup Factory I worked in a team."
  - id: "why"
    q_fi: "Miksi haet tätä työtä?"
    q_en: "Why are you applying for this job?"
    a_fi: "Asennustyö sellutehtaalla meni hyvin, ja työnantaja arvioi työni kiitettäväksi. Haluan jatkaa asennustöissä ja oppia lisää."
    a_en: "The fitting work at the pulp mill went well, and my employer rated my work excellent. I want to keep doing fitting work and learn more."
  - id: "finnish"
    q_fi: "Miten pärjäät suomen kielellä?"
    q_en: "How is your Finnish?"
    a_fi: "Suomen kielen taitoni on vielä perustasolla, ja opiskelen sitä aktiivisesti. Puhun englantia sujuvasti."
    a_en: "My Finnish is still basic, and I'm actively studying it. I speak English fluently."
  - id: "start"
    q_fi: "Milloin voit aloittaa?"
    q_en: "When can you start?"
    a_fi: ""
    a_en: ""
    hint: "Your facts don't say when you can start. Write it once; it's reused for every Industrial job."
blockers:
  - label: "1+ years' experience"
    fi: "Asentajan työstä minulla on seitsemän viikon kokemus, ja työnantaja arvioi työni kiitettäväksi. Haluan oppia lisää."
    en: "I have seven weeks' experience as a fitter, and my employer rated my work excellent. I want to learn more."
ask:
  - fi: "Millainen on tavallinen työpäivä?"
    en: "What does a normal working day look like?"
  - fi: "Missä työmaat ovat, ja miten sinne kuljetaan?"
    en: "Where are the work sites, and how do people get there?"
  - fi: "Kenen kanssa työskentelisin?"
    en: "Who would I work with?"
  - fi: "Voiko työn ohessa oppia hitsausta tai suorittaa kortteja?"
    en: "Can I learn welding or get cards while working?"
